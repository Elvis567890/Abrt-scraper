<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
  <button id="testBtn">Test Login</button>
  <pre id="result"></pre>
  <script>
    document.getElementById('testBtn').addEventListener('click', function(e) {
      e.preventDefault();
      fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email:'test@test.com', password:'123456'})
      })
      .then(r => r.text())
      .then(text => document.getElementById('result').textContent = text)
      .catch(err => document.getElementById('result').textContent = 'Error: ' + err);
    });
  </script>
</body>
</html>
