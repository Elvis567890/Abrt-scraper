<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel – Arbitrage Scanner</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        h1 { color: #333; }
        .login-form { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .login-form input { padding: 10px; font-size: 16px; flex: 1; }
        .login-form button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .login-form button:hover { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #f2f2f2; }
        .status-pending { color: orange; font-weight: bold; }
        .status-approved { color: green; font-weight: bold; }
        .status-rejected { color: red; font-weight: bold; }
        .btn { padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .btn-approve { background: #28a745; color: white; }
        .btn-approve:hover { background: #1e7e34; }
        .btn-reject { background: #dc3545; color: white; }
        .btn-reject:hover { background: #c82333; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .error { color: red; margin: 10px 0; }
        .success { color: green; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin – Payment Approvals</h1>

        <div id="auth-section">
            <div class="login-form">
                <input type="email" id="email" placeholder="Admin Email" value="afrinode60@gmail.com">
                <input type="password" id="password" placeholder="Password">
                <button id="loginBtn">Login</button>
                <span style="margin-left: 20px; line-height: 40px;">or</span>
                <input type="text" id="tokenInput" placeholder="Paste JWT Token" style="flex: 2;">
                <button id="setTokenBtn">Use Token</button>
            </div>
            <div id="authStatus"></div>
        </div>

        <div id="payments-section" style="display: none;">
            <button id="refreshBtn" style="margin-bottom: 10px;">🔄 Refresh</button>
            <div id="message"></div>
            <table>
                <thead>
                    <tr><th>ID</th><th>User</th><th>Plan</th><th>Transaction ID</th><th>Status</th><th>Submitted</th><th>Actions</th></tr>
                </thead>
                <tbody id="paymentsBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('adminToken') || '';
        const authStatus = document.getElementById('authStatus');
        const paymentsSection = document.getElementById('payments-section');
        const paymentsBody = document.getElementById('paymentsBody');
        const messageDiv = document.getElementById('message');

        function showMessage(text, isError = false) {
            messageDiv.textContent = text;
            messageDiv.className = isError ? 'error' : 'success';
            setTimeout(() => { messageDiv.textContent = ''; }, 5000);
        }

        function setToken(newToken) {
            token = newToken;
            localStorage.setItem('adminToken', token);
            authStatus.textContent = 'Token set.';
            authStatus.style.color = 'green';
            fetchPayments();
        }

        async function login(email, password) {
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.ok) {
                    setToken(data.token);
                } else {
                    authStatus.textContent = 'Login failed: ' + data.error;
                    authStatus.style.color = 'red';
                }
            } catch (e) {
                authStatus.textContent = 'Network error: ' + e.message;
                authStatus.style.color = 'red';
            }
        }

        async function fetchPayments() {
            if (!token) {
                paymentsSection.style.display = 'none';
                return;
            }
            try {
                const res = await fetch('/api/admin/payments', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.status === 401 || res.status === 403) {
                    authStatus.textContent = 'Unauthorized. Please login again.';
                    authStatus.style.color = 'red';
                    paymentsSection.style.display = 'none';
                    localStorage.removeItem('adminToken');
                    token = '';
                    return;
                }
                const data = await res.json();
                if (data.ok) {
                    renderPayments(data.payments);
                    paymentsSection.style.display = 'block';
                    authStatus.textContent = '✅ Logged in as admin';
                    authStatus.style.color = 'green';
                } else {
                    showMessage('Error fetching payments: ' + data.error, true);
                }
            } catch (e) {
                showMessage('Network error: ' + e.message, true);
            }
        }

        function renderPayments(payments) {
            paymentsBody.innerHTML = '';
            if (!payments || payments.length === 0) {
                paymentsBody.innerHTML = '<tr><td colspan="7">No payments found.</td></tr>';
                return;
            }
            payments.forEach(p => {
                const row = document.createElement('tr');
                const statusClass = 'status-' + p.status;
                let actions = '';
                if (p.status === 'pending') {
                    actions = `
                        <button class="btn btn-approve" data-id="${p.id}" data-action="approve">Approve</button>
                        <button class="btn btn-reject" data-id="${p.id}" data-action="reject">Reject</button>
                    `;
                } else {
                    actions = '—';
                }
                row.innerHTML = `
                    <td>${p.id}</td>
                    <td>${p.email || '?'}</td>
                    <td>${p.plan}</td>
                    <td>${p.transaction_id}</td>
                    <td class="${statusClass}">${p.status}</td>
                    <td>${new Date(p.submitted_at).toLocaleString()}</td>
                    <td>${actions}</td>
                `;
                paymentsBody.appendChild(row);
            });

            document.querySelectorAll('[data-action]').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = btn.dataset.id;
                    const action = btn.dataset.action;
                    await handleAction(id, action);
                });
            });
        }

        async function handleAction(id, action) {
            const url = `/api/admin/payments/${id}/${action}`;
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                if (data.ok) {
                    showMessage(`Payment ${action}ed successfully.`);
                    fetchPayments();
                } else {
                    showMessage('Error: ' + data.error, true);
                }
            } catch (e) {
                showMessage('Network error: ' + e.message, true);
            }
        }

        document.getElementById('loginBtn').addEventListener('click', () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!email || !password) {
                authStatus.textContent = 'Please enter email and password.';
                authStatus.style.color = 'red';
                return;
            }
            login(email, password);
        });

        document.getElementById('setTokenBtn').addEventListener('click', () => {
            const t = document.getElementById('tokenInput').value.trim();
            if (t) setToken(t);
        });

        document.getElementById('refreshBtn').addEventListener('click', fetchPayments);

        if (token) {
            fetchPayments();
        } else {
            authStatus.textContent = 'Please login or paste a token.';
        }
    </script>
</body>
    </html>
