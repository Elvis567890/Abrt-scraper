name: Scrape and Deploy Arbitrage Data

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:          # manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 tenacity

      - name: List Python files (debug)
        run: ls -la *.py || echo "No .py files found"

      - name: Run Python scraper
        run: python -c "from scraper import run_scan; run_scan()"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_ACTIONS: true   # prevents Flask from loading

      - name: Find and copy JSONs to root + Debug
        run: |
          echo "Searching for JSON files..."
          find . -name "current_opportunities.json" -exec cp {} . \;
          find . -name "arb_history.json" -exec cp {} . \;
          echo "=== JSON CONTENT PREVIEW ==="
          head -n 20 current_opportunities.json || echo "FILE NOT FOUND"
          echo "=== END PREVIEW ==="
          ls -la *.json
          echo "Triggering Pages rebuild at $(date)" > trigger_rebuild.txt

      - name: Commit and push updated JSON files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Stash local changes to avoid pull conflicts
          git stash || true
          git pull --rebase origin main
          git stash pop || true
          git add -f current_opportunities.json arb_history.json trigger_rebuild.txt
          git diff --staged --quiet || git commit -m "Update arbitrage data and force Pages rebuild [skip ci]"
          git push origin main
