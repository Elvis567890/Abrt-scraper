name: Scrape and Deploy Arbitrage Data

on:
  schedule:
    - cron: '0 */2 * * *'    # every 2 hours (adjust as needed)
  workflow_dispatch:          # manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 tenacity

      - name: Run Python scraper
        run: python -c "from scraper import run_scan; run_scan()"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_ACTIONS: true   # prevents Flask from loading

      - name: Copy JSONs to root for commit
        run: |
          find . -name "current_opportunities.json" -exec cp {} . \;
          find . -name "arb_history.json" -exec cp {} . \;

      - name: Check if any JSON changed
        id: check_changes
        run: |
          # Save current content for comparison
          if [ -f current_opportunities.json ]; then
            cp current_opportunities.json /tmp/current_new.json
          else
            touch /tmp/current_new.json
          fi
          if [ -f arb_history.json ]; then
            cp arb_history.json /tmp/history_new.json
          else
            touch /tmp/history_new.json
          fi

          # Compare with previously committed versions (if any)
          git show HEAD:current_opportunities.json > /tmp/current_old.json 2>/dev/null || echo "{}" > /tmp/current_old.json
          git show HEAD:arb_history.json > /tmp/history_old.json 2>/dev/null || echo "{}" > /tmp/history_old.json

          CHANGED=0
          if ! cmp -s /tmp/current_old.json /tmp/current_new.json; then
            CHANGED=1
          fi
          if ! cmp -s /tmp/history_old.json /tmp/history_new.json; then
            CHANGED=1
          fi

          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == '1'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f current_opportunities.json arb_history.json
          git commit -m "Update arbitrage data [skip ci]"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
