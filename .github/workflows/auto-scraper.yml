name: Scrape and Deploy Arbitrage Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Python scraper
        run: python -c "from scraper_light import run_scan; run_scan()"

      - name: Commit and push JSONs
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add current_opportunities.json arb_history.json || true
          git diff --staged --quiet || git commit -m "Update arbitrage data [skip ci]"
          git push
