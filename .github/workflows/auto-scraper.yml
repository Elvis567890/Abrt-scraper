name: Build and Push to ghcr.io

on:
  schedule:
    - cron: '0 8 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4   # optional: upgrade from v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3   # latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/abrt-scraper:latest

      - name: Run scraper
        run: |
          docker run --rm \
            -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e ADMIN_EMAILS="${{ secrets.ADMIN_EMAILS }}" \
            -e ENABLE_SCHEDULER="false" \
            ghcr.io/${{ github.repository_owner }}/abrt-scraper:latest \
            python -c "from scraper import run_scan_and_store; run_scan_and_store()"

      # ✅ Fixed: use v4
      - name: Upload opportunities file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunities
          path: current_opportunities.json
