name: Build and Push to ghcr.io

on:
  schedule:
    - cron: '0 8 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}   # Ensure this secret exists (classic PAT with write:packages)

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/elvis567890/abrt-scraper:latest
            ghcr.io/elvis567890/abrt-scraper:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run scraper
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            -e DATABASE_URL="sqlite:////tmp/users.db" \
            -e ADMIN_EMAILS="${{ secrets.ADMIN_EMAILS }}" \
            -e ENABLE_SCHEDULER="false" \
            -e OPPORTUNITIES_FILE="/app/current_opportunities.json" \
            -e HISTORY_FILE="/app/arb_history.json" \
            -e SCANNER_STATUS_FILE="/app/scanner_status.json" \
            ghcr.io/elvis567890/abrt-scraper:latest \
            python -c "from scraper import run_scan_and_store; run_scan_and_store()"

      - name: Upload opportunities file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunities
          path: ${{ github.workspace }}/current_opportunities.json

      # ----------------------------------------------------------------------
      # OPTIONAL: Deploy the generated JSON to your live server via SSH/SCP.
      # Uncomment and configure the following step if you want your live app
      # to automatically receive the updated opportunities file.
      # You will need to add these secrets to your repository:
      #   DEPLOY_HOST   - your server IP or domain
      #   DEPLOY_USER   - SSH username
      #   DEPLOY_KEY    - SSH private key (or use password)
      #   DEPLOY_PATH   - remote directory where the app expects the file
