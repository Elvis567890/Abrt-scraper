name: Build and Push to ghcr.io

on:
  schedule:
    - cron: '0 8 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}   # Ensure this secret exists with write:packages scope

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/abrt-scraper:latest
            ghcr.io/${{ github.repository_owner }}/abrt-scraper:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run scraper
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e ADMIN_EMAILS="${{ secrets.ADMIN_EMAILS }}" \
            -e ENABLE_SCHEDULER="false" \
            ghcr.io/${{ github.repository_owner }}/abrt-scraper:latest \
            python -c "from scraper import run_scan_and_store; run_scan_and_store()"

      - name: Upload opportunities file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunities
          path: ${{ github.workspace }}/current_opportunities.json
