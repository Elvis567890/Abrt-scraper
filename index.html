
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#0b0f14"
>

<title>
    Uganda Arbitrage Scanner
</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px;
    background: #0b0f14;
    color: #e7edf5;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

header {
    padding: 20px 0;
}

h1 {
    margin: 0 0 8px;
    font-size: 26px;
}

.subtitle {
    color: #8d9aaa;
}

.scan-info {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin: 15px 0 20px;
}

.info {
    background: #111821;
    border: 1px solid #202b37;
    border-radius: 12px;
    padding: 14px;
}

.info small {
    display: block;
    color: #7f8b99;
    margin-bottom: 5px;
}

.info strong {
    font-size: 18px;
}

.arb-card {
    background: #111821;
    border: 1px solid #24303d;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow:
        0 8px 30px
        rgba(0,0,0,.18);
}

.top-line {
    display: flex;
    gap: 15px;
    justify-content: space-between;
    align-items: flex-start;
}

h2 {
    margin: 0 0 6px;
    font-size: 18px;
}

.league {
    color: #7f8b99;
    font-size: 13px;
}

.profit {
    color: #42e695;
    font-size: 21px;
    font-weight: 800;
    white-space: nowrap;
}

.market {
    display: inline-block;
    margin: 10px 0;
    padding: 5px 9px;
    border-radius: 7px;
    background: #1b2632;
    color: #b7c3d0;
    font-size: 12px;
}

.stats {
    display: grid;
    grid-template-columns:
        repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 15px;
}

.stats > div {
    background: #0d141c;
    border-radius: 9px;
    padding: 10px;
}

.stats small {
    display: block;
    color: #718091;
    font-size: 10px;
    margin-bottom: 5px;
}

.stats strong {
    font-size: 12px;
}

.odds-header,
.odd-row {
    display: grid;
    grid-template-columns:
        .7fr 1.5fr 1fr 1fr;
    gap: 8px;
    align-items: center;
}

.odds-header {
    color: #667485;
    font-size: 10px;
    padding: 7px 8px;
}

.odd-row {
    padding: 10px 8px;
    border-top: 1px solid #202a35;
    font-size: 12px;
}

.odd-row small {
    display: block;
    color: #758394;
    margin-top: 2px;
}

.outcome {
    font-weight: 700;
}

.empty {
    padding: 40px 20px;
    text-align: center;
    color: #768394;
    background: #111821;
    border-radius: 14px;
}

footer {
    color: #596676;
    font-size: 11px;
    padding: 20px 0;
    text-align: center;
}

@media(max-width:600px) {

    body {
        padding: 10px;
    }

    h1 {
        font-size: 22px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .odds-header,
    .odd-row {
        grid-template-columns:
            .7fr 1.4fr 1fr 1fr;
        font-size: 11px;
    }

    .arb-card {
        padding: 13px;
    }

}

</style>

</head>

<body>

<div class="container">

<header>

<h1>
    Uganda Arbitrage Scanner
</h1>

<div class="subtitle">
    Last scan: 2026-09-04T19:42:33.339548+00:00
</div>

</header>

<div class="scan-info">

<div class="info">
    <small>Opportunities</small>
    <strong>0</strong>
</div>

<div class="info">
    <small>Events</small>
    <strong>2252</strong>
</div>

<div class="info">
    <small>Bookmakers</small>
    <strong>13</strong>
</div>

</div>

<div>


        <div class="empty">
            No valid arbitrage opportunities found
            in this scan.
        </div>
        

</div>

<footer>

Arbitrage calculations are theoretical.
Odds can change before placement.

</footer>

</div>

</body>

</html>
