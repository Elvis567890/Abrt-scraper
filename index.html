<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abrimax - Live Arbitrage</title>
    <style>
        :root {
            --bg: #0d0f13;
            --surface: #161820;
            --surface2: #1c1e26;
            --surface3: #22242e;
            --text: #e8e8ec;
            --text2: #a0a4b0;
            --text3: #6b6f7c;
            --green: #00e676;
            --green-glow: rgba(0,230,118,0.25);
            --red: #ff5252;
            --blue: #448aff;
            --yellow: #ffc107;
            --orange: #ff9100;
            --accent: #00e676;
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 8px;
            --font: "Segoe UI", system-ui, -apple-system, sans-serif;
            --nav-height: 72px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { min-height:100%; }
        body {
            font-family: var(--font);
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        button, input, select { font: inherit; }
        button, a { -webkit-tap-highlight-color: transparent; }
        .phone-frame {
            width: 390px;
            height: 844px;
            background: var(--bg);
            border-radius: 36px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 0 6px #1a1a1a, 0 0 0 8px #2a2a2a, 0 20px 60px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
        }
        @media (max-width: 430px) {
            .phone-frame { width:100vw; height:100vh; border-radius:0; box-shadow:none; }
        }
        .status-bar {
            height:44px;
            background:var(--bg);
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 24px;
            color:#fff;
            font-size:12px;
            font-weight:600;
            flex-shrink:0;
        }
        .main-content {
            flex:1;
            overflow-y:auto;
            overflow-x:hidden;
            scroll-behavior:smooth;
            -webkit-overflow-scrolling:touch;
            padding-bottom:8px;
        }
        .main-content::-webkit-scrollbar { width:0; }
        .page { display:none; padding:0 16px 20px; animation:fadeSlideIn 0.3s ease; }
        .page.active { display:block; }
        @keyframes fadeSlideIn {
            from { opacity:0; transform:translateY(12px); }
            to { opacity:1; transform:translateY(0); }
        }
        @keyframes glowPulse {
            0%,100% { box-shadow:0 0 12px var(--green-glow); }
            50% { box-shadow:0 0 24px var(--green-glow), 0 0 40px rgba(0,230,118,0.15); }
        }
        .page-header {
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:8px 0 14px;
        }
        .page-header h1 { font-size:22px; font-weight:700; color:var(--text); }
        .filter-tabs { display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; }
        .filter-tabs::-webkit-scrollbar { display:none; }
        .filter-tab {
            padding:9px 18px;
            border-radius:22px;
            font-size:13px;
            font-weight:600;
            cursor:pointer;
            white-space:nowrap;
            border:1.5px solid var(--surface3);
            background:transparent;
            color:var(--text2);
        }
        .filter-tab.active {
            background:var(--accent);
            color:#000;
            border-color:var(--accent);
            font-weight:700;
            box-shadow:0 2px 12px var(--green-glow);
        }
        .opp-card {
            background:var(--surface);
            border-radius:var(--radius);
            padding:16px;
            margin-bottom:10px;
            cursor:pointer;
            border:1px solid transparent;
            transition:all 0.2s;
        }
        .opp-card:active { transform:scale(0.985); border-color:var(--surface3); }
        .opp-card .top-row {
            display:flex;
            justify-content:space-between;
            align-items:flex-start;
            gap:10px;
            margin-bottom:10px;
        }
        .event-info { flex:1; min-width:0; }
        .sport-badge {
            font-size:10px;
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:0.8px;
            color:var(--blue);
            margin-bottom:4px;
        }
        .event-name {
            font-size:15px;
            font-weight:700;
            color:var(--text);
            text-transform:capitalize;
            overflow-wrap:anywhere;
        }
        .market-type { font-size:12px; color:var(--text2); margin-top:2px; }
        .profit-badge {
            background:rgba(0,230,118,0.12);
            color:var(--green);
            font-weight:700;
            font-size:16px;
            padding:8px 14px;
            border-radius:20px;
            white-space:nowrap;
            animation:glowPulse 2.5s infinite;
        }
        .bookie-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:4px; }
        .bookie-link {
            color:var(--text);
            text-decoration:none;
            display:inline-flex;
            align-items:center;
            gap:6px;
            background:var(--surface2);
            padding:7px 12px;
            border-radius:20px;
            font-size:12px;
            font-weight:600;
            transition:background 0.2s;
            cursor:pointer;
            max-width:100%;
        }
        .bookie-link:hover { background:var(--surface3); color:var(--accent); }
        .bookie-dot {
            width:18px;
            height:18px;
            border-radius:50%;
            font-weight:700;
            font-size:9px;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            color:#fff;
            flex-shrink:0;
        }
        .stake-preview { font-size:11px; color:var(--text3); margin-top:6px; }
        .arb-meta { font-size:11px; color:var(--text3); margin-top:2px; }
        .detail-header { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
        .back-btn {
            width:36px;
            height:36px;
            border-radius:50%;
            background:var(--surface2);
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            font-size:18px;
            border:none;
            color:var(--text);
            flex-shrink:0;
        }
        .detail-sport {
            font-size:11px;
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:1px;
            color:var(--blue);
        }
        .detail-event {
            font-size:18px;
            font-weight:700;
            color:var(--text);
            text-transform:capitalize;
            overflow-wrap:anywhere;
        }
        .detail-timer { font-size:13px; color:var(--orange); font-weight:600; }
        .outcome-cards {
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:10px;
            margin-bottom:16px;
        }
        .outcome-card {
            background:var(--surface);
            border-radius:var(--radius);
            padding:16px 8px;
            text-align:center;
            border:2px solid transparent;
            transition:all 0.2s;
            min-width:0;
        }
        .outcome-card.highlight {
            border-color:var(--green);
            box-shadow:0 0 20px var(--green-glow);
        }
        .outcome-label {
            font-size:12px;
            color:var(--text2);
            margin-bottom:6px;
            font-weight:600;
            text-transform:capitalize;
            overflow-wrap:anywhere;
        }
        .outcome-odds {
            font-size:28px;
            font-weight:800;
            color:var(--text);
            letter-spacing:-1px;
        }
        .outcome-bookie {
            font-size:11px;
            color:var(--text3);
            margin-top:2px;
            overflow-wrap:anywhere;
        }
        .stake-input-group {
            background:var(--surface);
            border-radius:var(--radius);
            padding:14px 16px;
            margin-bottom:14px;
        }
        .stake-input-group label {
            font-size:12px;
            color:var(--text2);
            font-weight:600;
            display:block;
            margin-bottom:6px;
        }
        .stake-input-row { display:flex; align-items:center; gap:8px; }
        .stake-input-row input {
            flex:1;
            min-width:0;
            background:var(--surface2);
            border:2px solid var(--surface3);
            color:var(--text);
            font-size:20px;
            font-weight:700;
            padding:12px 14px;
            border-radius:var(--radius-xs);
            outline:none;
            font-family:var(--font);
        }
        .stake-input-row .currency { font-size:18px; font-weight:700; color:var(--text2); }
        .breakdown-table {
            background:var(--surface);
            border-radius:var(--radius);
            padding:14px 16px;
            margin-bottom:14px;
        }
        .breakdown-row {
            display:flex;
            justify-content:space-between;
            gap:12px;
            padding:6px 0;
            font-size:13px;
            color:var(--text2);
            border-bottom:1px solid var(--surface2);
        }
        .breakdown-row span:first-child { overflow-wrap:anywhere; }
        .breakdown-row:last-child {
            border-bottom:none;
            font-weight:700;
            color:var(--green);
            font-size:15px;
        }
        .breakdown-row .val { color:var(--text); font-weight:600; white-space:nowrap; }
        .breakdown-row:last-child .val { color:var(--green); }
        .cta-row { display:flex; gap:10px; }
        .cta-btn {
            flex:1;
            padding:14px;
            border-radius:var(--radius-sm);
            font-weight:700;
            font-size:14px;
            cursor:pointer;
            text-align:center;
            border:none;
            transition:all 0.2s;
            font-family:var(--font);
        }
        .cta-btn.primary {
            background:var(--accent);
            color:#000;
            box-shadow:0 4px 16px var(--green-glow);
        }
        .cta-btn.secondary {
            background:var(--surface2);
            color:var(--text);
            border:1.5px solid var(--surface3);
        }
        .cta-btn:active { transform:scale(0.95); }
        .calc-card {
            background:var(--surface);
            border-radius:var(--radius);
            padding:20px;
            margin-bottom:14px;
        }
        .calc-input { margin-bottom:14px; }
        .calc-input label {
            font-size:12px;
            font-weight:600;
            color:var(--text2);
            display:block;
            margin-bottom:5px;
        }
        .calc-input input {
            width:100%;
            background:var(--surface2);
            border:2px solid var(--surface3);
            color:var(--text);
            font-size:17px;
            padding:12px 14px;
            border-radius:var(--radius-xs);
            outline:none;
        }
        .calc-result {
            background:var(--surface2);
            border-radius:var(--radius-sm);
            padding:16px;
            text-align:center;
            margin-top:8px;
        }
        .profit-ring {
            width:80px;
            height:80px;
            border-radius:50%;
            border:6px solid var(--green);
            margin:0 auto 12px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:18px;
            font-weight:800;
            color:var(--green);
            box-shadow:0 0 24px var(--green-glow);
        }
        .slip-item {
            background:var(--surface);
            border-radius:var(--radius);
            padding:14px 16px;
            margin-bottom:10px;
            display:flex;
            align-items:center;
            gap:12px;
        }
        .slip-bookie {
            width:40px;
            height:40px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:800;
            font-size:11px;
            color:#fff;
            flex-shrink:0;
        }
        .slip-info { flex:1; min-width:0; }
        .slip-event {
            font-weight:600;
            color:var(--text);
            font-size:13px;
            text-transform:capitalize;
            overflow-wrap:anywhere;
        }
        .slip-detail { font-size:11px; color:var(--text2); }
        .slip-stake {
            font-weight:700;
            color:var(--text);
            font-size:14px;
            white-space:nowrap;
        }
        .slip-actions { display:flex; gap:6px; }
        .slip-actions button {
            width:32px;
            height:32px;
            border-radius:50%;
            border:none;
            cursor:pointer;
            font-size:14px;
        }
        .btn-copy { background:var(--surface2); color:var(--text); }
        .btn-open { background:var(--blue); color:#fff; }
        .bookie-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .bookie-card {
            background:var(--surface);
            border-radius:var(--radius);
            padding:16px;
            text-align:center;
            border:2px solid transparent;
        }
        .bookie-card.connected { border-color:rgba(0,230,118,0.3); }
        .bookie-logo {
            width:48px;
            height:48px;
            border-radius:50%;
            margin:0 auto 10px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:800;
            font-size:14px;
            color:#fff;
        }
        .bookie-name { font-weight:700; color:var(--text); font-size:14px; }
        .bookie-status {
            font-size:10px;
            font-weight:700;
            color:var(--green);
            margin-top:4px;
            text-transform:uppercase;
        }
        .summary-cards {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:8px;
            margin-bottom:16px;
        }
        .summary-card {
            background:var(--surface);
            border-radius:var(--radius-sm);
            padding:14px;
            text-align:center;
        }
        .summary-val {
            font-size:22px;
            font-weight:800;
            color:var(--text);
            overflow-wrap:anywhere;
        }
        .summary-label {
            font-size:10px;
            color:var(--text3);
            text-transform:uppercase;
        }
        .profit-chart {
            background:var(--surface);
            border-radius:var(--radius);
            padding:16px;
            margin-bottom:14px;
            height:120px;
            display:flex;
            align-items:flex-end;
            gap:6px;
            overflow-x:auto;
        }
        .chart-bar {
            flex:1;
            min-width:8px;
            background:var(--green);
            border-radius:4px 4px 0 0;
            min-height:8px;
            opacity:0.8;
        }
        .hist-item {
            background:var(--surface);
            border-radius:var(--radius-sm);
            padding:12px 14px;
            margin-bottom:8px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
        }
        .hist-info { flex:1; min-width:0; }
        .hist-event {
            font-weight:600;
            color:var(--text);
            font-size:13px;
            overflow-wrap:anywhere;
        }
        .hist-date { font-size:11px; color:var(--text3); }
        .status-chip {
            font-size:10px;
            font-weight:700;
            padding:5px 10px;
            border-radius:12px;
            text-transform:uppercase;
        }
        .status-placed { background:rgba(0,230,118,0.15); color:var(--green); }
        .status-invalid { background:rgba(255,82,82,0.15); color:var(--red); }
        .alert-card {
            background:var(--surface);
            border-radius:var(--radius-sm);
            padding:14px 16px;
            margin-bottom:8px;
            display:flex;
            align-items:center;
            gap:12px;
            cursor:pointer;
        }
        .alert-icon {
            width:40px;
            height:40px;
            border-radius:50%;
            background:rgba(0,230,118,0.12);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:18px;
            flex-shrink:0;
        }
        .alert-info { flex:1; min-width:0; }
        .alert-event {
            font-weight:600;
            color:var(--text);
            font-size:13px;
            text-transform:capitalize;
            overflow-wrap:anywhere;
        }
        .alert-meta { font-size:11px; color:var(--text3); }
        .alert-profit { font-weight:700; color:var(--green); font-size:14px; white-space:nowrap; }
        .bottom-nav {
            height:72px;
            background:var(--surface);
            display:flex;
            align-items:center;
            justify-content:space-around;
            border-top:1px solid var(--surface3);
            flex-shrink:0;
        }
        .nav-item {
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:4px;
            cursor:pointer;
            padding:6px 12px;
            background:none;
            border:none;
            color:var(--text3);
            font-family:var(--font);
            font-size:10px;
            font-weight:600;
        }
        .nav-item.active { color:var(--accent); }
        .toast {
            position:absolute;
            bottom:110px;
            left:50%;
            transform:translateX(-50%);
            background:#333;
            color:#fff;
            padding:10px 20px;
            border-radius:20px;
            font-size:13px;
            font-weight:600;
            z-index:50;
            opacity:0;
            pointer-events:none;
            transition:opacity 0.3s;
            white-space:nowrap;
        }
        .toast.show { opacity:1; }
        .empty-state {
            text-align:center;
            padding:50px 20px;
            color:var(--text3);
        }
        .settings-section { margin-bottom:18px; }
        .settings-section h3 {
            font-size:12px;
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:1px;
            color:var(--text3);
            margin-bottom:10px;
        }
        .slider-container {
            background:var(--surface);
            border-radius:var(--radius-sm);
            padding:14px 16px;
        }
        .slider-container input[type="range"] {
            width:100%;
            accent-color:var(--accent);
            margin-top:6px;
        }
        .fab {
            position:absolute;
            bottom:100px;
            right:20px;
            width:50px;
            height:50px;
            border-radius:50%;
            background:var(--accent);
            color:#000;
            font-size:22px;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            box-shadow:0 8px 28px var(--green-glow);
            z-index:20;
            border:none;
        }
        .icon-btn {
            background:var(--surface2);
            border:none;
            color:var(--text);
            border-radius:50%;
            width:36px;
            height:36px;
            cursor:pointer;
            font-size:16px;
            position:relative;
            margin-left:4px;
        }
        .badge-dot {
            width:8px;
            height:8px;
            background:var(--red);
            border-radius:50%;
            position:absolute;
            top:6px;
            right:6px;
            border:2px solid var(--surface2);
        }
        .settings-input {
            width:100%;
            padding:10px;
            background:var(--surface2);
            color:var(--text);
            border:1px solid var(--surface3);
            border-radius:var(--radius-xs);
            margin-top:6px;
        }
        .setting-row { margin-bottom:14px; }
        .setting-row label { color:var(--text2); font-size:12px; font-weight:600; }
    </style>
</head>
<body>
    <div class="phone-frame" id="app">
        <div class="status-bar">
            <span class="time" id="clockTime">9:41</span>
            <div class="status-icons">5G ▮▮▮▮ 🔋</div>
        </div>
        <div class="toast" id="toast">Ready</div>
        <div class="main-content" id="mainContent">

            <!-- Dashboard -->
            <div class="page active" id="page-dashboard">
                <div class="page-header">
                    <h1>🔍 Abrimax</h1>
                    <div>
                        <button class="icon-btn" id="alertsButton" type="button" title="Alerts">🔔<span class="badge-dot"></span></button>
                        <button class="icon-btn" id="settingsButton" type="button" title="Settings">⚙️</button>
                    </div>
                </div>
                <div class="filter-tabs" id="dashboardFilterTabs">
                    <button class="filter-tab active" data-filter="all" type="button">All</button>
                    <button class="filter-tab" data-filter="football" type="button">Football</button>
                    <button class="filter-tab" data-filter="high" type="button">High Profit (&gt;5%)</button>
                </div>
                <div id="oppList"></div>
                <button class="fab" id="calculatorFab" type="button">🧮</button>
            </div>

            <!-- Detail -->
            <div class="page" id="page-detail"></div>

            <!-- Calculator -->
            <div class="page" id="page-calculator">
                <div class="detail-header">
                    <button class="back-btn" id="calculatorBackButton" type="button">←</button>
                    <h1 style="font-size:20px;">🧮 Arbitrage Calculator</h1>
                </div>
                <div class="calc-card">
                    <div class="calc-input">
                        <label for="calcStake">Total Stake (UGX)</label>
                        <input type="number" id="calcStake" value="100000" min="1" oninput="updateCalculator()">
                    </div>
                    <div class="calc-input">
                        <label for="calcOdds1">Odds 1</label>
                        <input type="number" id="calcOdds1" value="3.60" min="1.01" step="0.01" oninput="updateCalculator()">
                    </div>
                    <div class="calc-input">
                        <label for="calcOdds2">Odds 2</label>
                        <input type="number" id="calcOdds2" value="3.82" min="1.01" step="0.01" oninput="updateCalculator()">
                    </div>
                    <div class="calc-input" id="calcOdds3Container">
                        <label for="calcOdds3">Odds 3</label>
                        <input type="number" id="calcOdds3" value="3.82" min="1.01" step="0.01" oninput="updateCalculator()">
                    </div>
                    <button class="cta-btn secondary" id="toggleThirdOddsButton" type="button" style="width:100%;font-size:12px;">Toggle 3rd Outcome</button>
                    <div class="calc-result" id="calcResult"></div>
                </div>
                <button class="cta-btn primary" id="saveCalculatorButton" type="button" style="width:100%;">📋 Save to Bet Slip</button>
            </div>

            <!-- Bet slip -->
            <div class="page" id="page-slip">
                <div class="page-header">
                    <h1>📋 Bet Slip</h1>
                    <span id="slipCount">0 bets</span>
                </div>
                <div id="slipItems"></div>
                <div class="slip-summary" id="slipSummary" style="display:none;">
                    <div>Total Profit</div>
                    <div class="summary-profit" id="slipProfit">+UGX 0</div>
                    <button class="cta-btn primary" id="completeArbButton" type="button" style="width:100%;margin-top:10px;">✅ Complete Arb</button>
                </div>
            </div>

            <!-- Bookmakers -->
            <div class="page" id="page-bookies">
                <div class="page-header">
                    <h1>🏦 Bookmakers</h1>
                </div>
                <div class="bookie-grid">
                    <div class="bookie-card connected">
                        <div class="bookie-logo" style="background:#027a48;">B365</div>
                        <div class="bookie-name">Bet365</div>
                        <div class="bookie-status">Available</div>
                    </div>
                    <div class="bookie-card connected">
                        <div class="bookie-logo" style="background:#f5a623;">SP</div>
                        <div class="bookie-name">SportyBet</div>
                        <div class="bookie-status">Available</div>
                    </div>
                    <div class="bookie-card connected">
                        <div class="bookie-logo" style="background:#1a5ba8;">1XB</div>
                        <div class="bookie-name">1xBet</div>
                        <div class="bookie-status">Available</div>
                    </div>
                    <div class="bookie-card connected">
                        <div class="bookie-logo" style="background:#e63946;">PIN</div>
                        <div class="bookie-name">Pinnacle</div>
                        <div class="bookie-status">Available</div>
                    </div>
                </div>
            </div>

            <!-- Settings -->
            <div class="page" id="page-settings">
                <div class="page-header">
                    <h1>⚙️ Settings</h1>
                    <button class="icon-btn" id="saveSettingsButton" type="button">💾</button>
                </div>

                <!-- Filters -->
                <div class="settings-section">
                    <h3>🎚️ Filters</h3>
                    <div class="slider-container">
                        <div class="setting-row">
                            <label for="minProfitInput">Minimum profit percentage</label>
                            <input class="settings-input" type="number" id="minProfitInput" min="0" max="99" step="0.1">
                        </div>
                        <div class="setting-row">
                            <label for="maxProfitInput">Maximum profit percentage</label>
                            <input class="settings-input" type="number" id="maxProfitInput" min="0" max="999" step="0.1">
                        </div>
                        <label style="display:block;color:var(--text2);font-size:12px;margin-bottom:8px;">Markets</label>
                        <label style="display:block;color:var(--text2);font-size:13px;margin-bottom:7px;">
                            <input type="checkbox" id="market1x2"> 1X2
                        </label>
                        <label style="display:block;color:var(--text2);font-size:13px;margin-bottom:7px;">
                            <input type="checkbox" id="marketOu"> Over/Under
                        </label>
                        <label style="display:block;color:var(--text2);font-size:13px;margin-bottom:7px;">
                            <input type="checkbox" id="marketAh"> Asian Handicap
                        </label>
                        <label style="display:block;color:var(--text2);margin-bottom:7px;font-size:13px;">
                            <input type="checkbox" id="marketBtts"> BTTS
                        </label>
                        <label style="display:block;color:var(--text2);font-size:13px;">
                            <input type="checkbox" id="marketDc"> Double Chance
                        </label>
                    </div>
                </div>
            </div>

            <!-- History -->
            <div class="page" id="page-history">
                <div class="page-header">
                    <h1>📊 History</h1>
                </div>
                <div class="summary-cards">
                    <div class="summary-card">
                        <div class="summary-val" id="totalArbs">0</div>
                        <div class="summary-label">Arbs Done</div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-val" id="totalProfit">UGX 0</div>
                        <div class="summary-label">Total Profit</div>
                    </div>
                </div>
                <div class="profit-chart" id="profitChart"></div>
                <div id="historyList"></div>
            </div>

            <!-- Alerts -->
            <div class="page" id="page-alerts">
                <div class="page-header">
                    <h1>🔔 Alerts</h1>
                </div>
                <div id="alertsList"></div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav" id="bottomNav">
            <button class="nav-item active" data-page="dashboard" type="button">🏠<span>Home</span></button>
            <button class="nav-item" data-page="slip" type="button">📋<span>Slip</span></button>
            <button class="nav-item" data-page="calculator" type="button">🧮<span>Calc</span></button>
            <button class="nav-item" data-page="bookies" type="button">🏦<span>Bookies</span></button>
            <button class="nav-item" data-page="history" type="button">📊<span>History</span></button>
        </div>
    </div>

    <script>
        "use strict";

        const appState = {
            opportunities: [],
            history: {},
            currentPage: "dashboard",
            currentOpportunity: null,
            slipBets: [],
            completedArbs: loadCompletedArbs(),
            thirdOddsEnabled: true,
            currentFilter: "all",
            settings: loadSettings()
        };

        function loadCompletedArbs() {
            try {
                return JSON.parse(localStorage.getItem("abrimax_completed_arbs") || "[]");
            } catch {
                return [];
            }
        }

        function loadSettings() {
            const defaults = {
                minProfit: 1,
                maxProfit: 99,
                markets: {
                    "1x2": true,
                    ou: true,
                    ah: true,
                    btts: true,
                    dc: true
                }
            };
            try {
                const saved = JSON.parse(localStorage.getItem("abrimax_settings") || "{}");
                return {
                    ...defaults,
                    ...saved,
                    markets: { ...defaults.markets, ...(saved.markets || {}) }
                };
            } catch {
                return defaults;
            }
        }

        function saveSettingsToStorage() {
            localStorage.setItem("abrimax_settings", JSON.stringify(appState.settings));
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function numberValue(value, fallback = 0) {
            const number = Number(value);
            return Number.isFinite(number) ? number : fallback;
        }

        function formatUGX(value) {
            return `UGX ${Math.round(numberValue(value)).toLocaleString()}`;
        }

        function formatPercent(value) {
            return `${numberValue(value).toFixed(2)}%`;
        }

        function setText(id, value) {
            const element = document.getElementById(id);
            if (element) element.textContent = value;
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            if (!toast) return;
            toast.textContent = message;
            toast.classList.add("show");
            clearTimeout(showToast.timeout);
            showToast.timeout = setTimeout(() => toast.classList.remove("show"), 2400);
        }

        function normalizeBet(bet = {}) {
            return {
                bookmaker: bet.bookmaker || bet.bookie || "Unknown",
                outcome: bet.outcome || bet.selection || "Unknown",
                odd: numberValue(bet.odd ?? bet.odds, 0),
                stake: numberValue(bet.stake, 0),
                win: numberValue(bet.win, 0)
            };
        }

        function normalizeOpportunity(item = {}) {
            const bets = Array.isArray(item.bets) ? item.bets.map(normalizeBet) : [];
            const profitPercent = numberValue(item.profit_percent ?? item.profitPercent, 0);
            const profitUGX = numberValue(item.profit_ugx ?? item.profitUGX, 0);
            const totalStake = numberValue(item.total_stake, bets.reduce((sum, bet) => sum + bet.stake, 0));
            return {
                ...item,
                match: item.match || "Unknown event",
                sport: item.sport || "Football",
                type: item.type || item.market_type || "1x2",
                market_type: item.market_type || item.type || "1x2",
                market_specifier: item.market_specifier || "",
                profitPercent,
                profit_percent: profitPercent,
                profitUGX,
                profit_ugx: profitUGX,
                total_stake: totalStake,
                bets,
                valid: item.valid !== false
            };
        }

        async function fetchOpportunities() {
            const list = document.getElementById("oppList");
            list.innerHTML = '<div class="empty-state">Loading opportunities...</div>';
            try {
                const response = await fetch('current_opportunities.json?t=' + Date.now());
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                appState.opportunities = Array.isArray(data) ? data.map(normalizeOpportunity) : [];
                renderOpportunities();
                renderAlerts();
            } catch (error) {
                console.error("Fetch error:", error);
                list.innerHTML = `<div class="empty-state">⚠️ Could not load opportunities. Make sure <code>current_opportunities.json</code> is present.</div>`;
            }
        }

        function getBookmakerUrl(bookmaker) {
            const urls = {
                sportybet: "https://sportybet.ug",
                championbet: "https://championbet.ug",
                ababet: "https://ababet.ug",
                fortebet: "https://fortebet.ug",
                "1xbet": "https://1xbet.ug",
                "22bet": "https://22bet.ug",
                melbet: "https://melbet.ug",
                bet365: "https://www.bet365.com",
                pinnacle: "https://www.pinnacle.com"
            };
            const key = String(bookmaker).toLowerCase().replaceAll(" ", "");
            return urls[key] || "#";
        }

        function getBookieColor(bookmaker) {
            const colors = {
                sportybet: "#f5a623",
                betpawa: "#7b2cbf",
                "1xbet": "#1a5ba8",
                fortebet: "#0f4c81",
                "22bet": "#d32f2f",
                melbet: "#2e7d32",
                ababet: "#d48c34",
                championbet: "#e65100",
                bet365: "#027a48",
                pinnacle: "#e63946"
            };
            return colors[String(bookmaker).toLowerCase()] || "#444";
        }

        function bookmakerInitials(bookmaker) {
            return String(bookmaker)
                .split(/\s+/)
                .map(part => part.charAt(0))
                .join("")
                .slice(0, 3)
                .toUpperCase();
        }

        function matchesFilter(opportunity, filter) {
            const profit = opportunity.profitPercent;
            const type = String(opportunity.type || opportunity.market_type || "1x2").toLowerCase();
            if (profit < appState.settings.minProfit || profit > appState.settings.maxProfit) return false;
            if (type.includes("over") && !appState.settings.markets.ou) return false;
            if (type.includes("asian") && !appState.settings.markets.ah) return false;
            if (type.includes("btts") && !appState.settings.markets.btts) return false;
            if (type.includes("double") && !appState.settings.markets.dc) return false;
            if (type.includes("1x2") && !appState.settings.markets["1x2"]) return false;
            if (filter === "football" && opportunity.sport.toLowerCase() !== "football") return false;
            if (filter === "high" && profit <= 5) return false;
            return true;
        }

        function renderOpportunities(filter = appState.currentFilter) {
            appState.currentFilter = filter;
            const list = document.getElementById("oppList");
            if (!appState.opportunities || appState.opportunities.length === 0) {
                list.innerHTML = '<div class="empty-state">No opportunities available.</div>';
                return;
            }
            const filtered = appState.opportunities.filter(opp => matchesFilter(opp, filter));
            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-state">No opportunities match your filters.</div>';
                return;
            }
            list.innerHTML = filtered.map((opportunity, index) => {
                const bets = opportunity.bets.map(bet => {
                    const bookmaker = escapeHtml(bet.bookmaker);
                    const outcome = escapeHtml(bet.outcome);
                    const url = getBookmakerUrl(bet.bookmaker);
                    const color = getBookieColor(bet.bookmaker);
                    return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="bookie-link" onclick="event.stopPropagation();">
                        <span class="bookie-dot" style="background:${color}">${escapeHtml(bookmakerInitials(bet.bookmaker))}</span>
                        <span>${bookmaker} ${outcome} @ ${bet.odd.toFixed(2)}</span>
                    </a>`;
                }).join("");
                return `<div class="opp-card" data-index="${index}" onclick="openOpportunity(${index})">
                    <div class="top-row">
                        <div class="event-info">
                            <div class="sport-badge">${escapeHtml(opportunity.sport)}</div>
                            <div class="event-name">${escapeHtml(opportunity.match)}</div>
                            <div class="market-type">${escapeHtml(opportunity.type)} · Pre-match</div>
                        </div>
                        <div class="profit-badge">+${formatPercent(opportunity.profitPercent)}</div>
                    </div>
                    <div class="bookie-row">${bets}</div>
                    <div class="stake-preview">Profit: ${formatUGX(opportunity.profitUGX)}</div>
                    <div class="arb-meta">${opportunity.valid ? "✅ Valid" : "❌ Invalid"}</div>
                </div>`;
            }).join("");
        }

        function openOpportunity(index) {
            const filtered = appState.opportunities.filter(opp => matchesFilter(opp, appState.currentFilter));
            const opportunity = filtered[index];
            if (!opportunity) return;
            appState.currentOpportunity = opportunity;
            navigateTo("detail", opportunity);
        }

        function navigateTo(pageName, data = null) {
            if (data) appState.currentOpportunity = data;
            document.querySelectorAll(".page").forEach(page => page.classList.remove("active"));
            const target = document.getElementById(`page-${pageName}`);
            if (!target) return;
            target.classList.add("active");
            appState.currentPage = pageName;
            document.querySelectorAll(".nav-item").forEach(item => item.classList.toggle("active", item.dataset.page === pageName));
            if (pageName === "detail") renderDetail();
            if (pageName === "calculator") updateCalculator();
            if (pageName === "slip") renderSlip();
            if (pageName === "history") renderHistory();
            if (pageName === "alerts") renderAlerts();
            if (pageName === "settings") renderSettingsForm();
            document.getElementById("mainContent")?.scrollTo({ top: 0, behavior: "smooth" });
        }

        function renderDetail() {
            const container = document.getElementById("page-detail");
            const opportunity = appState.currentOpportunity;
            if (!container || !opportunity) return;
            const bets = opportunity.bets || [];
            const outcomeCards = bets.map(bet => `
                <div class="outcome-card highlight">
                    <div class="outcome-label">${escapeHtml(bet.outcome)}</div>
                    <div class="outcome-odds">${bet.odd.toFixed(2)}</div>
                    <div class="outcome-bookie">${escapeHtml(bet.bookmaker)}</div>
                </div>`).join("");
            const rows = bets.map((bet, index) => `
                <div class="breakdown-row" data-bet-index="${index}">
                    <span>${escapeHtml(bet.bookmaker)} - ${escapeHtml(bet.outcome)}</span>
                    <span class="val">${formatUGX(bet.stake)}</span>
                </div>`).join("");
            container.innerHTML = `
                <div class="detail-header">
                    <button class="back-btn" id="detailBackButton" type="button">←</button>
                    <div>
                        <div class="detail-sport">${escapeHtml(opportunity.sport)}</div>
                        <div class="detail-event">${escapeHtml(opportunity.match)}</div>
                        <div class="detail-timer">Current opportunity</div>
                    </div>
                </div>
                <div class="outcome-cards">${outcomeCards}</div>
                <div class="stake-input-group">
                    <label for="detailStake">Total Stake (UGX)</label>
                    <div class="stake-input-row">
                        <input type="number" id="detailStake" min="1" value="${Math.round(opportunity.total_stake || 100000)}">
                        <span class="currency">UGX</span>
                    </div>
                </div>
                <div class="breakdown-table">
                    ${rows}
                    <div class="breakdown-row">
                        <span>Expected profit</span>
                        <span class="val" id="detailProfit">${formatUGX(opportunity.profitUGX)}</span>
                    </div>
                </div>
                <div class="cta-row">
                    <button class="cta-btn primary" id="addDetailToSlip" type="button">📋 Add to Slip</button>
                    <button class="cta-btn secondary" id="copyDetailButton" type="button">📄 Copy</button>
                </div>`;
            document.getElementById("detailBackButton")?.addEventListener("click", () => navigateTo("dashboard"));
            document.getElementById("detailStake")?.addEventListener("input", recalculateDetail);
            document.getElementById("addDetailToSlip")?.addEventListener("click", addOpportunityToSlip);
            document.getElementById("copyDetailButton")?.addEventListener("click", copyOpportunity);
            recalculateDetail();
        }

        function recalculateDetail() {
            const opportunity = appState.currentOpportunity;
            const input = document.getElementById("detailStake");
            if (!opportunity || !input) return;
            const totalStake = Math.max(1, numberValue(input.value, 100000));
            const originalStake = opportunity.total_stake || opportunity.bets.reduce((sum, bet) => sum + bet.stake, 0) || 100000;
            document.querySelectorAll(".breakdown-row[data-bet-index]").forEach(row => {
                const index = Number(row.dataset.betIndex);
                const bet = opportunity.bets[index];
                if (!bet) return;
                const stake = originalStake > 0 ? totalStake * (bet.stake / originalStake) : totalStake / opportunity.bets.length;
                row.querySelector(".val").textContent = formatUGX(stake);
            });
            const profit = totalStake * (opportunity.profitPercent / 100);
            setText("detailProfit", formatUGX(profit));
        }

        function addOpportunityToSlip() {
            const opportunity = appState.currentOpportunity;
            if (!opportunity) return;
            const input = document.getElementById("detailStake");
            const totalStake = Math.max(1, numberValue(input?.value, 100000));
            const originalStake = opportunity.total_stake || opportunity.bets.reduce((sum, bet) => sum + bet.stake, 0) || 100000;
            const bets = opportunity.bets.map(bet => ({
                ...bet,
                stake: originalStake > 0 ? totalStake * (bet.stake / originalStake) : totalStake / opportunity.bets.length
            }));
            appState.slipBets.push({
                match: opportunity.match,
                sport: opportunity.sport,
                type: opportunity.type,
                bets,
                totalStake,
                profitUGX: totalStake * (opportunity.profitPercent / 100)
            });
            renderSlip();
            navigateTo("slip");
            showToast("Added to bet slip.");
        }

        function addCurrentCalculationToSlip() {
            const stake = numberValue(document.getElementById("calcStake")?.value, 0);
            const odds = [
                numberValue(document.getElementById("calcOdds1")?.value, 0),
                numberValue(document.getElementById("calcOdds2")?.value, 0)
            ];
            if (appState.thirdOddsEnabled) odds.push(numberValue(document.getElementById("calcOdds3")?.value, 0));
            if (stake <= 0 || odds.some(odd => odd <= 1)) { showToast("Enter a valid stake and odds."); return; }
            const inverseSum = odds.reduce((sum, odd) => sum + 1 / odd, 0);
            const payout = stake / inverseSum;
            const profit = payout - stake;
            appState.slipBets.push({
                match: "Manual calculation",
                sport: "Other",
                type: "Manual",
                bets: odds.map((odd, index) => ({
                    bookmaker: `Outcome ${index + 1}`,
                    outcome: `Outcome ${index + 1}`,
                    odd,
                    stake: stake * ((1 / odd) / inverseSum),
                    win: payout
                })),
                totalStake: stake,
                profitUGX: profit
            });
            renderSlip();
            navigateTo("slip");
            showToast("Calculation saved.");
        }

        function renderSlip() {
            const items = document.getElementById("slipItems");
            const summary = document.getElementById("slipSummary");
            if (!items || !summary) return;
            setText("slipCount", `${appState.slipBets.length} bet${appState.slipBets.length === 1 ? "" : "s"}`);
            if (appState.slipBets.length === 0) {
                items.innerHTML = '<div class="empty-state">Your bet slip is empty.</div>';
                summary.style.display = "none";
                return;
            }
            items.innerHTML = appState.slipBets.map((slip, index) => `
                <div class="slip-item">
                    <div class="slip-bookie" style="background:${getBookieColor(slip.bets[0]?.bookmaker)}">${escapeHtml(bookmakerInitials(slip.bets[0]?.bookmaker || "ARB"))}</div>
                    <div class="slip-info">
                        <div class="slip-event">${escapeHtml(slip.match)}</div>
                        <div class="slip-detail">${slip.bets.length} outcomes · ${formatUGX(slip.totalStake)}</div>
                    </div>
                    <div class="slip-stake">${formatUGX(slip.profitUGX)}</div>
                    <div class="slip-actions">
                        <button class="btn-copy" type="button" data-copy-slip="${index}">📄</button>
                        <button class="btn-open" type="button" data-remove-slip="${index}">×</button>
                    </div>
                </div>`).join("");
            const totalProfit = appState.slipBets.reduce((sum, slip) => sum + numberValue(slip.profitUGX), 0);
            summary.style.display = "block";
            setText("slipProfit", `+${formatUGX(totalProfit)}`);
            document.querySelectorAll("[data-remove-slip]").forEach(btn => btn.addEventListener("click", () => {
                const index = Number(btn.dataset.removeSlip);
                appState.slipBets.splice(index, 1);
                renderSlip();
            }));
            document.querySelectorAll("[data-copy-slip]").forEach(btn => btn.addEventListener("click", () => copySlip(Number(btn.dataset.copySlip))));
        }

        async function copySlip(index) {
            const slip = appState.slipBets[index];
            if (!slip) return;
            const text = [
                "Abrimax bet slip",
                slip.match,
                ...slip.bets.map(bet => `${bet.bookmaker}: ${bet.outcome} @ ${bet.odd}`),
                `Stake: ${formatUGX(slip.totalStake)}`
            ].join("\n");
            await copyText(text);
        }

        async function copyOpportunity() {
            const opportunity = appState.currentOpportunity;
            if (!opportunity) return;
            const text = [
                "Abrimax opportunity",
                opportunity.match,
                `Profit: ${formatPercent(opportunity.profitPercent)}`,
                ...opportunity.bets.map(bet => `${bet.bookmaker}: ${bet.outcome} @ ${bet.odd}`)
            ].join("\n");
            await copyText(text);
        }

        async function copyText(text) {
            try { await navigator.clipboard.writeText(text); showToast("Copied ✓"); }
            catch { showToast("Copy failed."); }
        }

        function completeArb() {
            if (appState.slipBets.length === 0) { showToast("Your bet slip is empty."); return; }
            const profit = appState.slipBets.reduce((sum, slip) => sum + numberValue(slip.profitUGX), 0);
            const record = {
                id: Date.now(),
                date: new Date().toISOString(),
                match: appState.slipBets.map(slip => slip.match).join(" + "),
                profit,
                status: "placed"
            };
            appState.completedArbs.unshift(record);
            localStorage.setItem("abrimax_completed_arbs", JSON.stringify(appState.completedArbs));
            appState.slipBets = [];
            renderSlip();
            renderHistory();
            showToast("Arbitrage completed.");
        }

        function updateCalculator() {
            const result = document.getElementById("calcResult");
            if (!result) return;
            const stake = numberValue(document.getElementById("calcStake")?.value, 0);
            const odds = [
                numberValue(document.getElementById("calcOdds1")?.value, 0),
                numberValue(document.getElementById("calcOdds2")?.value, 0)
            ];
            if (appState.thirdOddsEnabled) odds.push(numberValue(document.getElementById("calcOdds3")?.value, 0));
            if (stake <= 0 || odds.some(odd => odd <= 1)) {
                result.innerHTML = '<div class="empty-state">Enter valid values.</div>';
                return;
            }
            const inverseSum = odds.reduce((sum, odd) => sum + 1 / odd, 0);
            const payout = stake / inverseSum;
            const profit = payout - stake;
            const percent = (profit / stake) * 100;
            const stakes = odds.map(odd => stake * ((1 / odd) / inverseSum));
            result.innerHTML = `
                <div class="profit-ring">${percent.toFixed(2)}%</div>
                <div style="color:var(--text);font-weight:700;">Guaranteed payout: ${formatUGX(payout)}</div>
                <div style="color:var(--green);font-weight:700;margin-top:6px;">Profit: ${formatUGX(profit)}</div>
                <div style="color:var(--text2);font-size:12px;margin-top:10px;">${stakes.map((value, index) => `Outcome ${index + 1}: ${formatUGX(value)}`).join("<br>")}</div>`;
        }

        function toggleThirdOdds() {
            appState.thirdOddsEnabled = !appState.thirdOddsEnabled;
            document.getElementById("calcOdds3Container").style.display = appState.thirdOddsEnabled ? "block" : "none";
            updateCalculator();
        }

        function renderHistory() {
            const entries = getHistoryEntries();
            const list = document.getElementById("historyList");
            if (!list) return;
            const totalProfit = entries.reduce((sum, entry) => sum + numberValue(entry.profit), 0);
            setText("totalArbs", entries.length);
            setText("totalProfit", formatUGX(totalProfit));
            renderProfitChart(entries);
            if (entries.length === 0) { list.innerHTML = '<div class="empty-state">No arbitrage history yet.</div>'; return; }
            list.innerHTML = entries.slice(0, 50).map(entry => `
                <div class="hist-item">
                    <div class="hist-info">
                        <div class="hist-event">${escapeHtml(entry.match)}</div>
                        <div class="hist-date">${formatDate(entry.timestamp)}</div>
                    </div>
                    <div style="text-align:right;">
                        <div style="color:var(--green);font-weight:700;">+${formatUGX(entry.profit)}</div>
                        <span class="status-chip ${entry.valid ? "status-placed" : "status-invalid"}">${entry.valid ? "valid" : "invalid"}</span>
                    </div>
                </div>`).join("");
        }

        function getHistoryEntries() {
            const localEntries = appState.completedArbs.map(entry => ({
                match: entry.match || "Completed arbitrage",
                timestamp: entry.date || "",
                profit: entry.profit || 0,
                valid: entry.status !== "invalid"
            }));
            return localEntries.sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0));
        }

        function renderProfitChart(entries) {
            const chart = document.getElementById("profitChart");
            if (!chart) return;
            const values = entries.slice(0, 20).map(entry => Math.max(0, numberValue(entry.profit))).reverse();
            if (values.length === 0) { chart.innerHTML = '<div class="empty-state">No chart data</div>'; return; }
            const maximum = Math.max(...values, 1);
            chart.innerHTML = values.map(value => `<div class="chart-bar" title="${formatUGX(value)}" style="height:${Math.max(8, (value / maximum) * 90)}px"></div>`).join("");
        }

        function formatDate(value) {
            if (!value) return "Unknown date";
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return String(value);
            return date.toLocaleString();
        }

        function renderAlerts() {
            const container = document.getElementById("alertsList");
            if (!container) return;
            const alerts = appState.opportunities.filter(opp => opp.valid).sort((a, b) => b.profitPercent - a.profitPercent).slice(0, 30);
            if (alerts.length === 0) { container.innerHTML = '<div class="empty-state">No active alerts.</div>'; return; }
            container.innerHTML = alerts.map((opportunity, index) => `
                <div class="alert-card" data-alert-index="${index}">
                    <div class="alert-icon">🔔</div>
                    <div class="alert-info">
                        <div class="alert-event">${escapeHtml(opportunity.match)}</div>
                        <div class="alert-meta">${escapeHtml(opportunity.type)}</div>
                    </div>
                    <div class="alert-profit">+${formatPercent(opportunity.profitPercent)}</div>
                </div>`).join("");
            container.querySelectorAll("[data-alert-index]").forEach(element => {
                element.addEventListener("click", () => {
                    const index = Number(element.dataset.alertsIndex);
                    const opportunity = alerts[index];
                    if (opportunity) navigateTo("detail", opportunity);
                });
            });
        }

        function renderSettingsForm() {
            const settings = appState.settings;
            document.getElementById("minProfitInput").value = settings.minProfit;
            document.getElementById("maxProfitInput").value = settings.maxProfit;
            document.getElementById("market1x2").checked = settings.markets["1x2"];
            document.getElementById("marketOu").checked = settings.markets.ou;
            document.getElementById("marketAh").checked = settings.markets.ah;
            document.getElementById("marketBtts").checked = settings.markets.btts;
            document.getElementById("marketDc").checked = settings.markets.dc;
        }

        function readSettingsForm() {
            appState.settings.minProfit = numberValue(document.getElementById("minProfitInput").value, 1);
            appState.settings.maxProfit = numberValue(document.getElementById("maxProfitInput").value, 99);
            appState.settings.markets = {
                "1x2": document.getElementById("market1x2").checked,
                ou: document.getElementById("marketOu").checked,
                ah: document.getElementById("marketAh").checked,
                btts: document.getElementById("marketBtts").checked,
                dc: document.getElementById("marketDc").checked
            };
        }

        function saveUserSettings() {
            readSettingsForm();
            saveSettingsToStorage();
            renderOpportunities();
            showToast("Settings saved.");
        }

        function updateClock() {
            const element = document.getElementById("clockTime");
            if (!element) return;
            element.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        }

        function bindEvents() {
            document.getElementById("alertsButton")?.addEventListener("click", () => navigateTo("alerts"));
            document.getElementById("settingsButton")?.addEventListener("click", () => navigateTo("settings"));
            document.getElementById("calculatorFab")?.addEventListener("click", () => navigateTo("calculator"));
            document.getElementById("calculatorBackButton")?.addEventListener("click", () => navigateTo("dashboard"));
            document.getElementById("toggleThirdOddsButton")?.addEventListener("click", toggleThirdOdds);
            document.getElementById("saveCalculatorButton")?.addEventListener("click", addCurrentCalculationToSlip);
            document.getElementById("completeArbButton")?.addEventListener("click", completeArb);
            document.getElementById("saveSettingsButton")?.addEventListener("click", saveUserSettings);
            document.getElementById("dashboardFilterTabs")?.addEventListener("click", (event) => {
                const button = event.target.closest(".filter-tab");
                if (!button) return;
                document.querySelectorAll("#dashboardFilterTabs .filter-tab").forEach(tab => tab.classList.remove("active"));
                button.classList.add("active");
                renderOpportunities(button.dataset.filter || "all");
            });
            document.querySelectorAll(".nav-item").forEach(button => button.addEventListener("click", () => navigateTo(button.dataset.page)));
        }

        function initialize() {
            bindEvents();
            renderSettingsForm();
            updateCalculator();
            updateClock();
            setInterval(updateClock, 30000);
            fetchOpportunities();
        }

        document.addEventListener("DOMContentLoaded", initialize);
    </script>
</body>
    </html>
